# Copy to the project root, add .vale-styles/ to .gitignore, then run `vale sync`.
#
# Vale and Harper run in full: they are the deterministic rules, and most of
# their alerts carry the fix the rule defines. The rules named one by one below
# are the mechanical ones from two packages whose other rules are opinions about
# wording, which the humanize skill has already settled by the time this runs.

StylesPath = .vale-styles
MinAlertLevel = suggestion
Vocab = Project

Packages = Harper, write-good, proselint

[*.{md,txt}]
BasedOnStyles = Vale, Harper

proselint.Nonwords = YES
proselint.Typography = YES
proselint.Malapropisms = YES
proselint.Oxymorons = YES
proselint.Uncomparables = YES
proselint.DateRedundancy = YES
proselint.DateCase = YES
proselint.Currency = YES
proselint.Diacritical = YES
proselint.Archaisms = YES
proselint.GenderBias = YES
proselint.P-Value = YES
write-good.Illusions = YES

# Vale has no LaTeX parser. Reading .tex as Markdown keeps paragraph and
# sentence boundaries; TokenIgnores removes whole macros, which is what keeps
# citation keys and labels out of the spelling report.
[formats]
tex = md

[*.tex]
BasedOnStyles = Vale, Harper
TokenIgnores = (\\[a-zA-Z]+\{[^}]*\})

proselint.Nonwords = YES
proselint.Malapropisms = YES
proselint.P-Value = YES
